<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Call face analysis</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e6edf3;
      --muted: #8b9bab;
      --line: #24303a;
      --paper: #0b0e11;
      --card: #12171c;
      --accent: #d4a017;
      --inmate: #3dbeb6;
      --ok: #3dbeb6;
      --no: #e85d4c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    main { max-width: 1240px; margin: 0 auto; padding: 0 20px 64px; }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      padding: 18px 0 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }
    .kicker {
      margin: 0;
      color: var(--accent);
      font: 11px/1.2 ui-monospace, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 4px 0 0; letter-spacing: 0.01em; }
    .lead { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
    form, .result, .face {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0;
    }
    [hidden] { display: none !important; }
    form { padding: 16px; display: grid; gap: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; }
    label { display: grid; gap: 6px; font-size: 0.85rem; color: var(--muted); }
    input[type="number"], select {
      width: 7rem;
      padding: 7px 8px;
      font: 13px/1.2 ui-monospace, monospace;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 0;
    }
    select { width: 100%; }
    button {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 8px 12px;
      font: 11px/1 ui-monospace, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { border-color: var(--inmate); color: var(--inmate); }
    button:disabled { opacity: 0.6; cursor: progress; }
    .stage { position: relative; width: 100%; min-width: 0; }
    .stage img { display: block; width: 100%; height: auto; }
    video { display: block; width: 100%; max-width: 100%; height: auto; background: #000; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .status { min-height: 1.4em; color: var(--muted); }
    .result { margin-top: 18px; padding: 16px; display: grid; gap: 16px; }
    .face { padding: 14px; display: grid; gap: 10px; }
    .face header { display: flex; gap: 12px; align-items: center; }
    .face img.crop { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; background: #eee; }
    .badge { font-weight: 650; }
    .badge.yes { color: var(--ok); }
    .badge.no { color: var(--no); }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .bar { position: relative; height: 14px; background: #0b0e11; border: 1px solid var(--line); overflow: hidden; cursor: pointer; }
    .bar i {
      position: absolute;
      top: 0; bottom: 0;
      background: var(--accent);
      min-width: 3px;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
    th { color: var(--muted); font: 11px/1.2 ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
    .cell-face { display: inline-flex; align-items: center; gap: 8px; }
    .mini { width: 40px; height: 52px; object-fit: contain; background: #000; }
    tr.hit { cursor: pointer; }
    tr.hit:hover { background: #1a222b; }
    .error { color: var(--no); }
    .narrative { white-space: pre-wrap; margin: 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; }
    .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .person {
      display: grid;
      grid-template-columns: 148px 1fr;
      gap: 12px;
      align-items: center;
      padding: 10px;
      background: #0e1318;
      border: 1px solid var(--line);
      border-left: 3px solid var(--line);
    }
    .person img, .thumb {
      width: 148px;
      height: 180px;
      object-fit: contain;
      background: #000;
    }
    .thumb { width: 88px; height: 110px; }
    .person.inmate { border-left-color: var(--inmate); }
    .person.visitor { border-left-color: var(--accent); }
    .stamp {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 6px;
      font: 10px/1.4 ui-monospace, monospace;
      letter-spacing: 0.12em;
      border: 1px solid var(--line);
      vertical-align: 2px;
    }
    .person.inmate .stamp { color: var(--inmate); border-color: var(--inmate); }
    .person.visitor .stamp { color: var(--accent); border-color: var(--accent); }
    .call {
      display: grid;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .faces { display: flex; flex-wrap: wrap; gap: 10px; }
    .who { display: grid; justify-items: center; gap: 4px; font-size: 0.85rem; }
    .answers { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .answers li { padding: 10px 12px; background: #0e1318; border-left: 3px solid var(--line); }
    .answers strong { display: block; }
    h2 { font-size: 1.15rem; margin: 8px 0 0; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); }
    .tabs button { margin-bottom: -1px; background: transparent; }
    .tabs button.active { color: var(--ink); border-color: var(--inmate); background: var(--card); }
    .panel { margin-top: 0; }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <div>
        <p class="kicker">Surveillance · visitation</p>
        <h1>Call face analysis</h1>
        <p class="lead">Subjects are the faces in each visit. Inmate and visitor come from one sample frame read by Gemma when this case opens. Invert the sides only to correct that read.</p>
      </div>
      <div class="toolbar">
        <label>Identity threshold
          <input id="threshold" type="number" min="0.05" max="0.95" step="0.05" value="0.45">
        </label>
        <button id="swap" type="button">Invert sides</button>
      </div>
    </header>
    <p class="status" id="report-status">Reading a sample frame and building the case…</p>
    <nav class="tabs" aria-label="Analysis sections">
      <button type="button" class="active" data-tab="reports">Reports</button>
      <button type="button" data-tab="subjects">Subjects</button>
      <button type="button" data-tab="calls">Call log</button>
      <button type="button" data-tab="note">Case note</button>
      <button type="button" data-tab="compare">Compare</button>
    </nav>
    <section id="panel-reports" class="panel result"></section>
    <section id="panel-subjects" class="panel result" hidden></section>
    <section id="panel-calls" class="panel result" hidden></section>
    <section id="panel-note" class="panel result" hidden>
      <p class="status" id="gemma-status">Waiting for the case facts.</p>
      <pre class="narrative" id="gemma-text"></pre>
    </section>
    <section id="panel-compare" class="panel" hidden>
    <form id="form">
      <div class="row">
        <label>Photo
          <input id="file" type="file" accept="image/*" required>
        </label>
        <button id="go" type="submit">Compare</button>
      </div>
      <div class="stage" id="stage" hidden>
        <img id="preview" alt="Uploaded photo">
        <canvas id="boxes"></canvas>
      </div>
      <p class="status" id="status"></p>
    </form>
    <section id="out"></section>
    </section>
  </main>
  <script>
    const form = document.getElementById("form");
    const fileInput = document.getElementById("file");
    const status = document.getElementById("status");
    const stage = document.getElementById("stage");
    const preview = document.getElementById("preview");
    const canvas = document.getElementById("boxes");
    const out = document.getElementById("out");
    const colors = ["#9a3412", "#1d4ed8", "#166534", "#7c3aed", "#b45309"];
    let lastFaces = [];

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (preview.dataset.url) URL.revokeObjectURL(preview.dataset.url);
      const url = URL.createObjectURL(file);
      preview.dataset.url = url;
      stage.hidden = true;
      preview.onload = () => {
        if (!preview.naturalWidth) return;
        stage.hidden = false;
        status.textContent = "";
        clearBoxes();
      };
      preview.onerror = () => {
        stage.hidden = true;
        status.textContent = "This file could not be displayed as an image.";
      };
      preview.src = url;
    });

    function clearBoxes() {
      if (!preview.naturalWidth) return;
      canvas.width = preview.clientWidth;
      canvas.height = preview.clientHeight;
    }

    function drawBoxes(faces) {
      if (!preview.naturalWidth) return;
      const scaleX = preview.clientWidth / preview.naturalWidth;
      const scaleY = preview.clientHeight / preview.naturalHeight;
      canvas.width = preview.clientWidth;
      canvas.height = preview.clientHeight;
      const ctx = canvas.getContext("2d");
      faces.forEach((face, i) => {
        const [x1, y1, x2, y2] = face.box;
        ctx.strokeStyle = colors[i % colors.length];
        ctx.lineWidth = 3;
        ctx.strokeRect(x1 * scaleX, y1 * scaleY, (x2 - x1) * scaleX, (y2 - y1) * scaleY);
        ctx.font = "14px sans-serif";
        ctx.fillStyle = colors[i % colors.length];
        ctx.fillText(String(face.index), x1 * scaleX + 4, y1 * scaleY + 16);
      });
    }

    function clockSeek(video, seconds) {
      video.currentTime = seconds;
      video.play();
    }

    function render(data) {
      out.replaceChildren();
      lastFaces = data.faces;
      preview.onload = () => {
        stage.hidden = false;
        drawBoxes(lastFaces);
      };
      preview.src = data.preview;
      if (preview.complete && preview.naturalWidth) {
        stage.hidden = false;
        drawBoxes(lastFaces);
      }
      if (!data.faces.length) {
        status.textContent = "No face found in the image.";
        return;
      }
      const count = data.faces.length;
      status.textContent = count + (count === 1 ? " face in the photo." : " faces in the photo.") + " Click a segment to watch the video.";
      const duration = data.duration_s || 0;
      const wrap = document.createElement("div");
      wrap.className = "result";
      const video = data.clip ? document.createElement("video") : null;
      const bestSegment = data.faces
        .flatMap((face) => face.segments)
        .sort((a, b) => b.best - a.best)[0];
      if (video) {
        video.controls = true;
        video.preload = "auto";
        video.muted = true;
        video.playsInline = true;
        const start = bestSegment ? bestSegment.start_s : 0;
        video.src = "/clip#t=" + start;
        video.addEventListener("loadedmetadata", () => {
          if (Math.abs(video.currentTime - start) > 0.3) video.currentTime = start;
        });
        wrap.appendChild(video);
      }
      data.faces.forEach((face, i) => {
        const card = document.createElement("article");
        card.className = "face";
        const color = colors[i % colors.length];
        card.style.borderColor = color;
        const present = face.present;
        card.innerHTML = `
          <header>
            <img class="crop" alt="" src="${face.crop}">
            <div>
              <div>Face ${face.index}</div>
              <div class="badge ${present ? "yes" : "no"}">${present ? "Present in the saved points" : "Not in the saved points"}</div>
              <div class="meta">${face.person ? esc(face.person.label) + " · " + face.person.calls + (face.person.calls === 1 ? " call" : " calls") + (face.person.common_across_calls ? " · also in another call" : " · not seen in another call") : "No saved person at this threshold"}</div>
              <div class="meta">detection ${esc(face.detection_score.toFixed(2))} · best score ${esc(face.best.toFixed(3))} · ${esc(face.count)} ${face.count === 1 ? "match" : "matches"}</div>
            </div>
          </header>
          <div class="bar" title="Click to jump to this part"></div>
          <table>
            <thead><tr><th>Video</th><th>From</th><th>To</th><th>Frames</th><th>Matches</th><th>Score</th></tr></thead>
            <tbody></tbody>
          </table>
        `;
        const bar = card.querySelector(".bar");
        const body = card.querySelector("tbody");
        face.segments.forEach((seg) => {
          const left = duration ? (seg.start_s / duration) * 100 : 0;
          const width = duration ? Math.max(((seg.end_s - seg.start_s) / duration) * 100, 0.4) : 2;
          const mark = document.createElement("i");
          mark.style.left = left + "%";
          mark.style.width = width + "%";
          mark.style.background = color;
          mark.title = seg.start + " – " + seg.end;
          if (video) mark.addEventListener("click", () => clockSeek(video, seg.start_s));
          bar.appendChild(mark);
          const row = document.createElement("tr");
          if (video) row.className = "hit";
          row.innerHTML = `<td>${esc(seg.video)}</td><td>${esc(seg.start)}</td><td>${esc(seg.end)}</td><td>${esc(seg.start_frame)}–${esc(seg.end_frame)}</td><td>${esc(seg.hits)}</td><td>${esc(Number(seg.best).toFixed(3))}</td>`;
          if (video) row.addEventListener("click", () => clockSeek(video, seg.start_s));
          body.appendChild(row);
        });
        if (!face.segments.length) {
          card.querySelector("table").remove();
          card.querySelector(".bar").remove();
        }
        if (face.truncated) {
          const note = document.createElement("p");
          note.className = "meta";
          note.textContent = "The result hit the limit and may continue past these segments.";
          card.appendChild(note);
        }
        wrap.appendChild(card);
      });
      out.appendChild(wrap);
    }

    function faceImage(person) {
      const image = document.createElement("img");
      const threshold = Number(document.getElementById("threshold").value);
      image.alt = person.label;
      image.src = "/api/face/" + encodeURIComponent(person.id) + "?threshold=" + encodeURIComponent(threshold);
      return image;
    }

    function roleSelect(person) {
      const select = document.createElement("select");
      select.innerHTML = `<option value="">Automatic</option><option value="inmate">Inmate</option><option value="visitor">Visitor</option>`;
      select.value = person.role || "";
      select.addEventListener("change", async () => {
        await fetch("/api/role", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: person.id, role: select.value }),
        });
        await loadReport();
      });
      return select;
    }

    function roleName(person) {
      if (person.role === "inmate") return person.role_source === "marked" ? "inmate, marked" : "inmate, " + (person.role_source || "left") + " side";
      if (person.role === "visitor") return person.role_source === "marked" ? "visitor, marked" : "visitor, " + (person.role_source || "right") + " side";
      return "unmarked";
    }

    function table(headers, rows) {
      const el = document.createElement("table");
      el.innerHTML = `<thead><tr>${headers.map((item) => `<th>${esc(item)}</th>`).join("")}</tr></thead>`;
      const body = document.createElement("tbody");
      rows.forEach((cells) => {
        const row = document.createElement("tr");
        cells.forEach((cell) => {
          const td = document.createElement("td");
          if (cell instanceof Node) td.appendChild(cell);
          else td.textContent = cell;
          row.appendChild(td);
        });
        body.appendChild(row);
      });
      el.appendChild(body);
      return el;
    }

    function personCard(person) {
      const card = document.createElement("article");
      card.className = "person" + (person.role ? " " + person.role : "");
      card.appendChild(faceImage(person));
      const body = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = person.label;
      const stamp = document.createElement("span");
      stamp.className = "stamp";
      stamp.textContent = person.role ? person.role.toUpperCase() : "UNMARKED";
      title.appendChild(stamp);
      body.appendChild(title);
      const when = document.createElement("p");
      when.className = "meta";
      const seen = person.sample ? clockText(person.sample.pts_s) : "";
      const together = person.with.length
        ? person.with.map((other) => other.label + " ×" + other.calls).join(", ")
        : "nobody";
      when.textContent = (seen ? "Seen at " + seen + " · " : "") + person.calls + (person.calls === 1 ? " call" : " calls") + " · with " + together;
      body.appendChild(when);
      const label = document.createElement("label");
      label.append("Role");
      label.appendChild(roleSelect(person));
      body.appendChild(label);
      card.appendChild(body);
      return card;
    }

    function clockText(seconds) {
      const value = Math.max(0, Number(seconds) || 0);
      const hours = Math.floor(value / 3600);
      const minutes = Math.floor((value % 3600) / 60);
      const secs = Math.floor(value % 60);
      return [hours, minutes, secs].map((part) => String(part).padStart(2, "0")).join(":");
    }

    function answerItem(title, text) {
      const item = document.createElement("li");
      const heading = document.createElement("strong");
      heading.textContent = title;
      item.appendChild(heading);
      item.append(text);
      return item;
    }

    function showTab(name) {
      document.querySelectorAll(".panel").forEach((panel) => {
        panel.hidden = panel.id !== "panel-" + name;
      });
      document.querySelectorAll(".tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === name);
      });
    }

    function renderReport(data) {
      const note = document.createElement("p");
      note.className = "meta";
      const confirmed = data.side_judgment && (data.side_judgment.inmate_side === "left" || data.side_judgment.inmate_side === "right");
      const side = data.role_rule === "right" ? "inmate on the right" : "inmate on the left";
      const looked = confirmed
        ? " Side read from the sample frame: " + data.side_judgment.inmate_side + "."
        : " Sample frame did not show which side is the inmate. Working rule: " + side + ".";
      note.textContent = data.people.length + " subjects · " + data.calls.length + " calls · "
        + data.recordings.length + (data.recordings.length === 1 ? " recording." : " recordings.") + looked;
      document.getElementById("report-status").replaceWith(note);
      note.id = "report-status";

      const reports = document.getElementById("panel-reports");
      reports.replaceChildren();
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      wrap.appendChild(table(
        ["Call", "Time", "Inmate", "Visitor", "Calls together", "Inmate calls", "Visitor calls", "Visitor with other inmates", "Face in another recording"],
        reportRows(data),
      ));
      reports.appendChild(wrap);

      const subjects = document.getElementById("panel-subjects");
      subjects.replaceChildren();
      const people = document.createElement("div");
      people.className = "people";
      data.people.forEach((person) => people.appendChild(personCard(person)));
      subjects.appendChild(people);

      const calls = document.getElementById("panel-calls");
      calls.replaceChildren();
      data.calls.forEach((call) => {
        const block = document.createElement("article");
        block.className = "call";
        const heading = document.createElement("strong");
        heading.textContent = call.start.slice(0, 8) + " – " + call.end.slice(0, 8);
        block.appendChild(heading);
        const faces = document.createElement("div");
        faces.className = "faces";
        call.people.forEach((person) => {
          const who = document.createElement("div");
          who.className = "who";
          const image = faceImage(person);
          image.className = "thumb";
          who.appendChild(image);
          const name = document.createElement("span");
          name.textContent = person.label + " · " + roleName(person);
          who.appendChild(name);
          faces.appendChild(who);
        });
        block.appendChild(faces);
        calls.appendChild(block);
      });
    }

    function faceCell(person) {
      if (!person) return "—";
      const cell = document.createElement("span");
      cell.className = "cell-face";
      const image = faceImage(person);
      image.className = "mini";
      cell.appendChild(image);
      cell.append(person.label);
      return cell;
    }

    function reportRows(data) {
      const together = new Map(data.inmate_visitor_calls.map((row) => [row.inmate + "|" + row.visitor, row.calls]));
      const inmateTotal = new Map(data.inmate_calls.map((row) => [row.label, row.calls]));
      const visitorTotal = new Map(data.visitor_calls.map((row) => [row.label, row.calls]));
      const other = new Map(data.visitor_other_inmates.map((row) => [row.label, row.also_with_other_inmates]));
      const common = new Set(data.common_faces.map((row) => row.label));
      if (!data.calls.length) return [["—", "—", "—", "—", "—", "—", "—", "—", "—"]];
      return data.calls.map((call) => {
        const inmate = call.people.find((person) => person.role === "inmate") || null;
        const visitor = call.people.find((person) => person.role === "visitor") || null;
        const shared = inmate && visitor ? together.get(inmate.label + "|" + visitor.label) : null;
        const repeated = [inmate, visitor].some((person) => person && common.has(person.label));
        return [
          call.id,
          call.start.slice(0, 8) + " – " + call.end.slice(0, 8),
          faceCell(inmate),
          faceCell(visitor),
          shared == null ? "—" : String(shared),
          inmate ? String(inmateTotal.get(inmate.label) ?? "—") : "—",
          visitor ? String(visitorTotal.get(visitor.label) ?? "—") : "—",
          visitor ? (other.get(visitor.label) ? "Yes" : "No") : "—",
          repeated ? "Yes" : "No",
        ];
      });
    }

    async function loadReport() {
      const statusLine = document.getElementById("report-status");
      const threshold = Number(document.getElementById("threshold").value);
      try {
        const response = await fetch("/api/report?threshold=" + encodeURIComponent(threshold));
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "The report failed.");
        renderReport(data);
        loadGemma();
      } catch (err) {
        if (statusLine) statusLine.textContent = err.message;
      }
    }

    async function loadGemma() {
      const statusLine = document.getElementById("gemma-status");
      const text = document.getElementById("gemma-text");
      statusLine.textContent = "Writing the case note from the counted calls…";
      text.textContent = "";
      const threshold = Number(document.getElementById("threshold").value);
      try {
        const response = await fetch("/api/gemma-report?threshold=" + encodeURIComponent(threshold));
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Gemma failed.");
        statusLine.textContent = data.model;
        text.textContent = data.report;
      } catch (err) {
        statusLine.textContent = err.message;
      }
    }

    document.querySelectorAll(".tabs button").forEach((button) => {
      button.addEventListener("click", () => showTab(button.dataset.tab));
    });
    document.getElementById("threshold").addEventListener("change", () => {
      loadReport();
    });
    document.getElementById("swap").addEventListener("click", async () => {
      await fetch("/api/swap-sides", { method: "POST" });
      loadReport();
    });
    loadReport();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;
      const button = document.getElementById("go");
      button.disabled = true;
      status.textContent = "Searching…";
      out.replaceChildren();
      try {
        const payload = {
          image: await blobToBase64(file),
          threshold: Number(document.getElementById("threshold").value),
        };
        const response = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "The search failed.");
        render(data);
      } catch (err) {
        status.textContent = "";
        out.innerHTML = `<p class="error">${err.message}</p>`;
      } finally {
        button.disabled = false;
      }
    });

    function blobToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    window.addEventListener("resize", () => {
      if (!stage.hidden && preview.naturalWidth) drawBoxes(lastFaces);
    });
  </script>
</body>
</html>
